<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angels Burger Buzzer</title>
    <link rel="stylesheet" href="card-style-design.css">
</head>
<body>

<div id="menuView">
    <div class="header"><h1>ANGELS BURGER</h1><p>Order & Wait</p></div>

    <div class="filter-container">
        <button class="filter-chip chip-active" onclick="filterMenu('All', this)">All</button>
        <button class="filter-chip" onclick="filterMenu('Burger', this)">Burgers</button>
        <button class="filter-chip" onclick="filterMenu('Sandwich', this)">Sandwiches</button>
        <button class="filter-chip" onclick="filterMenu('Drink', this)">Drinks</button>
    </div>

    <div id="productList">Loading...</div>
    <div class="cart-btn" onclick="showCart()">VIEW CART (<span id="cartCount">0</span>)</div>
</div>

<div id="cartView" class="hidden">
    <div class="cart-header">
        <h2>Your Order</h2>
        <div style="font-size: 24px;">🛒</div>
    </div>
    <div id="cartItemsList"></div>
    <div class="cart-total">Total: P <span id="cartTotalDisplay">0.00</span></div>
    <button class="confirm-btn" onclick="submitOrder()">CONFIRM ORDER</button>
    <button class="back-btn" onclick="backToMenu()">ADD MORE ITEMS</button>
</div>

<div id="paymentView" class="hidden">
    <div id="paymentScreen">
        <p class="instruction">Show this code to the Cashier:</p>
        <span id="orderCode" class="big-code">----</span>
        <p style="color: #e65100; font-weight: bold;">Waiting for payment confirmation...</p>
    </div>
</div>

<div id="preparingView" class="hidden">
    <div class="spinner">🍔</div>
    <h2>Payment Confirmed!</h2>
    <p>Please take a seat.</p>
    <p>We will buzz this phone when ready.</p>
</div>

<div id="alarmView" class="hidden">
    <div id="alarmScreen">
        <div class="alarm-msg">ORDER READY!</div>
        <div class="alarm-code" id="alarmCodeDisplay">---</div>
        <div style="font-size: 60px;">🔔</div>
        <button class="stop-btn" id="actionBtn" onclick="silenceAlarm()">I'M COMING!</button>
    </div>
</div>

<script>
    let cart = [];
    let orderId = localStorage.getItem('angels_order_id');
    let alarmInterval = null;
    let allProductsData = [];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const FALLBACK_IMAGE = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

    window.onload = function() {
        if (orderId) checkStatusOnce(orderId);
    };

    function unlockAudio() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
    }

    function playBeep() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    fetch('/api/menu').then(r => r.json()).then(products => {
        allProductsData = products;
        renderList(allProductsData);
    }).catch(err => {
        document.getElementById('productList').innerHTML = '<p style="color:red">Connection Error. Check Wi-Fi.</p>';
    });

    function filterMenu(category, clickedBtn) {
        document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('chip-active'));
        clickedBtn.classList.add('chip-active');
        let filteredList = (category === 'All') ? allProductsData : allProductsData.filter(p => p.category === category);
        renderList(filteredList);
    }

    function renderList(productsToRender) {
        const list = document.getElementById('productList');
        list.innerHTML = '';
        if (productsToRender.length === 0) {
            list.innerHTML = '<p style="text-align:center; margin-top:20px; color:#666;">No items found.</p>';
            return;
        }
        productsToRender.forEach(p => {
            const disabledState = p.available ? '' : 'disabled';
            const btnText = p.available ? 'ADD' : 'SOLD OUT';
            const btnColor = p.available ? '#d32f2f' : '#9e9e9e';
            const opacity = p.available ? '1' : '0.6';

            let imageName = p.image || "";
            imageName = imageName.trim();

            let imagePath = imageName ? `/images/${encodeURIComponent(imageName)}` : FALLBACK_IMAGE;

            list.innerHTML += `
                    <div class="card" style="opacity: ${opacity};">
                         <img src="${imagePath}"
                              alt="${p.name}"
                              class="product-img"
                              onerror="this.onerror=null; this.src='${FALLBACK_IMAGE}';"> <div class="info">
                            <h3>${p.name}</h3><div class="price">P ${p.price.toFixed(2)}</div>
                        </div>
                        <button class="add-btn"
                                onclick="addToCart('${p.id}')"
                                style="background-color: ${btnColor};"
                                ${disabledState}>
                            ${btnText}
                        </button>
                    </div>`;
        });
    }

    function addToCart(id) {
        cart.push({ productId: id, quantity: 1 });
        updateCartCount();
    }

    function updateCartCount() {
        document.getElementById('cartCount').innerText = cart.length;
    }

    function showCart() {
        if (cart.length === 0) return alert("Your cart is empty!");
        const list = document.getElementById('cartItemsList');
        list.innerHTML = '';
        let total = 0;
        cart.forEach((item, index) => {
            const product = allProductsData.find(p => p.id === item.productId);
            if (product) {
                total += product.price;
                list.innerHTML += `
                        <div class="cart-item">
                            <div><b>${product.name}</b><br><span class="price">P ${product.price}</span></div>
                            <button class="remove-btn" onclick="removeFromCart(${index})">X</button>
                        </div>`;
            }
        });
        document.getElementById('cartTotalDisplay').innerText = total.toFixed(2);
        showView('cartView');
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartCount();
        if (cart.length === 0) backToMenu(); else showCart();
    }

    function backToMenu() { showView('menuView'); }

    function submitOrder() {
        if(cart.length === 0) return alert("Empty Cart!");
        unlockAudio();
        fetch('/api/order', { method: 'POST', body: JSON.stringify(cart) })
            .then(r => r.json())
            .then(id => {
                orderId = id;
                localStorage.setItem('angels_order_id', id);
                document.getElementById('orderCode').innerText = id;
                showView('paymentView');
                cart = [];
                updateCartCount();
                startPolling();
            });
    }

    function checkStatusOnce(id) {
        fetch(`/api/order/${id}/status`).then(r => r.text()).then(status => {
            document.getElementById('orderCode').innerText = id;
            if (status === 'PENDING_PAYMENT') { showView('paymentView'); startPolling(); }
            else if (status === 'PREPARING') { showView('preparingView'); startPolling(); }
            else if (status === 'READY') { triggerAlarm(); }
            else { localStorage.removeItem('angels_order_id'); orderId = null; showView('menuView'); }
        }).catch(() => {});
    }

    function startPolling() {
        const poll = setInterval(() => {
            if (!orderId) { clearInterval(poll); return; }
            fetch(`/api/order/${orderId}/status`).then(r => r.text()).then(status => {
                if (status === 'PREPARING') showView('preparingView');
                else if (status === 'READY') { clearInterval(poll); triggerAlarm(); }
                else if (status === 'COMPLETED' || status === 'NOT_FOUND') { clearInterval(poll); localStorage.removeItem('angels_order_id'); location.reload(); }
            }).catch(err => { if(err.message.includes("404")) { clearInterval(poll); localStorage.removeItem('angels_order_id'); location.reload(); }});
        }, 2000);
    }

    function triggerAlarm() {
        document.getElementById('alarmCodeDisplay').innerText = orderId;
        showView('alarmView');
        if (navigator.vibrate) navigator.vibrate([1000, 200, 1000, 200, 1000]);
        if (alarmInterval) clearInterval(alarmInterval);
        playBeep();
        alarmInterval = setInterval(playBeep, 800);
    }

    function silenceAlarm() {
        if (alarmInterval) clearInterval(alarmInterval);
        if (navigator.vibrate) navigator.vibrate(0);
        document.getElementById('alarmScreen').classList.add('silenced');
        document.querySelector('.alarm-msg').innerText = "Show this to Cashier:";
        const btn = document.getElementById('actionBtn');
        btn.innerText = "ORDER RECEIVED (EXIT)";
        btn.style.backgroundColor = "#ff9800";
        btn.style.color = "white";
        btn.onclick = function() { localStorage.removeItem('angels_order_id'); location.reload(); };
    }

    function showView(viewId) {
        ['menuView', 'cartView', 'paymentView', 'preparingView', 'alarmView'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.classList.add('hidden');
        });
        const target = document.getElementById(viewId);
        if(target) target.classList.remove('hidden');
    }
</script>
</body>
</html>
